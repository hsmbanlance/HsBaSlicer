syntax = "proto3";

package HsbaProto;

// LOM (Laminated Object Manufacturing) sheet-bonding / contour-cutting pipeline.

enum lom_cut_mode
{
    pipe_lom_contour = 0; // contour cutting
    pipe_lom_halftone = 1; // halftone (pocket) cutting
}

message lom_pipe_config
{
    string lom_pipe_config_model_name = 1; // model name
    string lom_pipe_config_model_path = 2; // model path

    float lom_pipe_config_layer_height = 3; // sheet thickness (mm)
    float lom_pipe_config_first_layer_height = 4; // first sheet thickness (mm)

    float lom_pipe_config_cut_speed = 5; // laser cut speed (mm/s)
    float lom_pipe_config_cut_margin = 6; // contour offset from part outline (mm)
    float lom_pipe_config_cut_power = 7; // laser cut power [0,1]

    float lom_pipe_config_bond_temperature = 8; // bonding temperature (C)
    float lom_pipe_config_bond_pressure = 9; // bonding pressure (MPa)
    float lom_pipe_config_bond_time = 10; // bonding time per layer (s)

    bool lom_pipe_config_seal_contour = 11; // seal/contour-cut the part edge
    lom_cut_mode lom_pipe_config_cut_mode = 12; // cutting mode

    string lom_pipe_config_export_lua_script = 13; // export lua script path (required)
    string lom_pipe_config_export_lua_func = 14; // export lua function name

    string lom_pipe_config_output_path = 15; // output path
}

message lom_pipe_result
{
    bool lom_pipe_result_success = 1; // result success
    int32 lom_pipe_result_total_layers = 2; // total layers
    string lom_pipe_result_export_path = 3; // export path
    string lom_pipe_result_error_message = 4; // error message
    double lom_pipe_result_elapsed_seconds = 5; // elapsed seconds
}
