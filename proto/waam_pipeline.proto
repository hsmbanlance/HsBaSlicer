syntax = "proto3";

package HsbaProto;

// WAAM (Wire Arc Additive Manufacturing) robot-based metal deposition pipeline.
// Output is a robot language program (ABB / KUKA / FANUC), not a layer zip.
// Enum value names use pipe_waam_ to stay unique inside the HsbaProto package.

enum waam_material
{
    pipe_waam_steel = 0; // steel
    pipe_waam_aluminum = 1; // aluminum
    pipe_waam_titanium = 2; // titanium
    pipe_waam_copper = 3; // copper
    pipe_waam_material_unknown = 4; // unknown
}

enum waam_weld_process
{
    pipe_waam_arc = 0; // arc welding (GMAW/GTAW)
    pipe_waam_laser = 1; // laser welding
    pipe_waam_process_unknown = 2; // unknown
}

enum waam_protection
{
    pipe_waam_shield_gas = 0; // shielding gas
    pipe_waam_vacuum = 1; // vacuum chamber
    pipe_waam_protection_unknown = 2; // unknown
}

enum waam_protect_gas
{
    pipe_waam_argon = 0; // argon
    pipe_waam_helium = 1; // helium
    pipe_waam_n2 = 2; // nitrogen
    pipe_waam_co2 = 3; // co2
    pipe_waam_gas_unknown = 4; // unknown
}

enum waam_robot_type
{
    pipe_waam_robot_abb = 0; // ABB RAPID
    pipe_waam_robot_kuka = 1; // KUKA KRL
    pipe_waam_robot_fanuc = 2; // FANUC TP
    pipe_waam_robot_unknown = 3; // unknown (requires Lua path script)
}

message waam_pipe_config
{
    string waam_pipe_config_model_name = 1; // model name
    string waam_pipe_config_model_path = 2; // model path

    float waam_pipe_config_layer_height = 3; // bead/layer height (mm)
    float waam_pipe_config_first_layer_height = 4; // first layer height (mm)

    float waam_pipe_config_bead_width = 5; // deposited bead width (mm)
    float waam_pipe_config_travel_speed = 6; // torch travel speed (mm/s)

    float waam_pipe_config_wire_feed_speed = 7; // wire feed speed (m/min)
    float waam_pipe_config_arc_current = 8; // welding current (A)
    float waam_pipe_config_arc_voltage = 9; // arc voltage (V)
    float waam_pipe_config_gas_flow_rate = 10; // shielding gas flow (L/min)

    waam_material waam_pipe_config_material = 11; // feedstock material
    waam_weld_process waam_pipe_config_welding_process = 12; // welding process
    waam_protection waam_pipe_config_protection = 13; // atmosphere protection
    waam_protect_gas waam_pipe_config_protect_gas = 14; // shielding gas type
    float waam_pipe_config_interpass_temperature = 15; // interpass temperature (C)

    waam_robot_type waam_pipe_config_robot_type = 16; // target robot controller

    string waam_pipe_config_path_lua_script = 17; // optional Lua path-generator script
    string waam_pipe_config_path_lua_func = 18; // optional Lua path-generator function

    string waam_pipe_config_output_path = 19; // output robot program path

    bool waam_pipe_config_spiral_mode = 20; // deposit outer wall as one continuous rising bead (vase mode)
}

message waam_pipe_result
{
    bool waam_pipe_result_success = 1; // result success
    int32 waam_pipe_result_total_layers = 2; // total layers
    string waam_pipe_result_output_path = 3; // output robot program path
    string waam_pipe_result_error_message = 4; // error message
    double waam_pipe_result_elapsed_seconds = 5; // elapsed seconds
}
