name: macOS toolchain setup
description: >-
  Installs the Homebrew tools HsBaSlicer needs on macOS / iOS runners.

runs:
  using: composite
  steps:
    - name: Install build dependencies
      shell: bash
      run: |
        brew update
        # Homebrew ships the rolling CMake 4.5.x, whose stricter source_group(TREE)
        # check used to make vcpkg's boost-locale port fail to configure
        # (".../libs/locale/include/boost/locale is not a prefix of file
        #   .../libs/locale/include/boost/locale.hpp"). The pinned baseline now
        # carries ports/boost-locale/fix-source-group.patch, which moves
        # locale.hpp out of that TREE listing, so no version pin is required.
        brew install cmake ninja python autoconf automake libtool autoconf-archive
        # Install PowerShell for version generation script
        brew install --cask powershell@preview
