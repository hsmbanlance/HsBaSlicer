name: Build on macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        shell: bash
        run: |
          brew update
          brew install cmake ninja python autoconf automake libtool autoconf-archive
          # Install PowerShell for version generation script
          brew install --cask powershell@preview

      - name: Clone vcpkg and bootstrap
        shell: bash
        run: |
          if [ ! -d "vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
            ./vcpkg/vcpkg integrate install
          fi
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> $GITHUB_ENV

      - name: Set up vcpkg binary cache backend
        shell: bash
        run: |
          echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> $GITHUB_ENV

      - name: Cache vcpkg downloads cache
        uses: actions/cache@v5
        with:
          path: ${VCPKG_ROOT}/downloads
          key: vcpkg-macos-${{ hashFiles('vcpkg.json') }}

      - name: Configure CMake
        shell: bash
        run: |
          # vcpkg treats connection failures as non-transient and gives up, so the
          # outer shell retries configure up to 5 times, wiping the build dir in
          # between to drop stale CMakeCache entries (same policy as docker/Dockerfile).
          ok=0
          for attempt in 1 2 3 4 5; do
            echo ">>> CMake configure attempt ${attempt}/5"
            if cmake -B build -S . -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake; then
              ok=1
              break
            fi
            rm -rf build
            [ "${attempt}" = 5 ] || { echo ">>> configure attempt ${attempt} failed; retrying in 30s"; sleep 30; }
          done
          [ "${ok}" = 1 ] || { echo "ERROR: CMake configure failed after 5 attempts"; exit 1; }

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release

      - name: Run tests
        shell: bash
        run: |
          cd build/tests
          ctest --build-config Release --output-on-failure --parallel 2
        continue-on-error: true
