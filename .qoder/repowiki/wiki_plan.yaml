# Repo Wiki 前置干预配置 / pre-generation guidance
# 官方机制: https://help.aliyun.com/zh/lingma/repo-wiki （见「干预 Wiki 生成 → wiki_plan.yaml」）
# 修改本文件后，需在 Qoder IDE 手动触发「生成 / 重新生成」才会生效；本文件随 Git 提交共享给团队。
# 目标：让 en / zh 两套 Wiki 结构对照一致（1:1）、去重、并最大化有效内容。基准为「中立合并」。
# Goal: make the en / zh wikis parallel (1:1), de-duplicated, and content-dense, using a neutral-merge baseline.

version: 1

repowiki:
  # architecture = 全面分析技术架构；product_requirement = 按产品需求格式输出
  template: "architecture"

  # 注入规划阶段的引导提示：引导 AI 关注指定重点（不强制限定页面，避免裁剪有效内容）
  notes:
    - text: >-
        每种语言的 Wiki 只用该语言命名分类与页面，严禁出现中英混合的名字（英文 Wiki 里不得出现任何中文字符，
        中文 Wiki 里不得出现英文分类名）。中英两侧使用语义一一对应的同一套分类、且叶子页面总数相等。
        13 个顶层分类——英文 Wiki 使用：Overview & Getting Started, Architecture Overview, Core Concepts,
        Core Modules, Advanced Features, Lua Scripting System, API Reference, Integration Guide,
        Development Testing & Contribution, Extension Development, Examples & Samples,
        Deployment Troubleshooting & FAQ, Appendix；
        中文 Wiki 使用：项目概述与快速开始, 架构总览, 核心概念, 核心模块详解, 高级主题, Lua 脚本系统,
        API 参考文档, 集成指南, 开发测试与贡献, 扩展开发指南, 示例与教程, 部署故障排除与FAQ, 附录。
        每个顶层分类都必须是一个文件夹并含一个与文件夹同名的索引页及其子页面，禁止把分类退化成仓库根的单个 .md 散页。
      author: "HsBaSlicer docs"
    - text: >-
        避免过度碎片化：同一模块/接口应归并为一篇实质性综合页，不要拆成大量薄页。API 参考文档与 Lua 脚本系统
        尤其不得出现数十个碎片页面；每个 C ABI 流水线、每个 LibHsBaSlicer 接口、每个 Lua 库各成一页即可，
        叶子总数须与另一语言保持一致。
      author: "HsBaSlicer docs"
    - text: >-
        合并策略为「逐主题取更完整一侧」（中立合并），绝不可删除任何一侧现有内容：当前 EN 128 页 / ZH 152 页且双向互有强弱，
        必须保留两侧作为素材。按分类的基准侧——核心概念/Lua 脚本系统/API 参考文档/扩展开发以 ZH 为基准（更完整）；
        核心模块详解/示例与教程/高级主题/集成指南以 EN 为基准（更完整）；Overview、Architecture、Dev-Test、Deployment、Appendix 两侧均为单页，保持精简即可。
        目标：两套 Wiki 收敛到同一套「并集」页面结构（每主题取强侧内容），再分别以各自语言生成/翻译到该统一结构。
      author: "HsBaSlicer docs"
    - text: >-
        去重：同一概念只归入一个分类。网格模型实现（IglModel / CgalModel / FullTopoModel）仅出现在
        「核心模块详解 / 模型处理」一次，不得同时出现在「核心概念 / 模型抽象接口」；填充算法仅出现在
        「核心模块详解 / 填充系统」一次，不得同时出现在「2D 几何算法 / 填充算法」。所有根级散页
        （项目概述、快速开始、贡献指南、附录）必须归入上述分类，不得游离于分类之外。
      author: "HsBaSlicer docs"
    - text: >-
        最大化有效内容：每个页面以一个一级标题（# H1）开头；正文必须基于源码实证——真实函数签名、配置字段与默认值，
        取自 pipelinetypes/pipeline_types.h、各 *_pipeline.h、LuaSupport.cpp、PolygonFill.cpp 等，严禁臆造 API 或默认值；
        每页至少包含一张 mermaid 图或一个信息表；有效行少于约 30 行的薄页应合并到上级页面，不单独立页。
      author: "HsBaSlicer docs"
    - text: >-
        每页页脚提供指向另一语言对应页面的链接。源码中保留 repowiki 自带的 <cite>、Section sources、Diagram sources、
        file:// 标记（发布脚本 repowiki_to_github_wiki.py::clean_content 会在发布时剥离），不要新增其他无法被清理器识别的噪声。
      author: "HsBaSlicer docs"
    - text: >-
        必须覆盖可选 RESTful API 服务模块 restapi/（构建产物 HsBaSlicerRestServer）：在「核心模块详解」与
        「API 参考文档」下各以其语言命名合成为一页实质综合页（勿拆碎片页），内容基于源码实证：
        启用双门控 -DHSBA_BUILD_REST_API=ON 且 VCPKG_MANIFEST_FEATURES=rest-api（桌面专属，vcpkg 端口 cpp-httplib
        的 CMake 包名为 httplib）；端点清单取自 routes.cpp（/api/health、/api/version、/api/pipelines 及 /api/kinds 别名、
        默认配置查询、/api/config/convert 双向 proto↔文本、/api/jobs 异步作业队列提交/轮询/结果下载/删除、
        /api/params 持久化）；JSON+XML 双格式协商优先级（?format= > Accept > server.default_format）；
        运行时配置来自 restapi.ini（监听地址/端口/并发/TTL/[paramstore] 后端）；架构分层 job_manager →
        pipeline_executor（转发 DllHsBaSlicer C ABI）→ config_bridge（复用 struct_json 反射序列化）；
        测试位于 tests/RestApi/（ctest -R restapi）。不得臆造未在 routes.cpp 中注册的端点。
      author: "HsBaSlicer docs"

  # documents 为页面白名单：一旦提供，生成器严格按列表输出。
  # 为「最大化有效内容」，此处留空，让生成器保留完整页面；notes 已注入对照/去重/质量标准作为软约束。
  # 若需要强制中英严格 1:1（可能牺牲部分页面），再在此填入统一叶子页清单。
  documents: []

knowledgecard:
  notes:
    - text: >-
        知识卡模块划分与上述 13 个分类对齐，尤其将模型处理、切片引擎、填充系统、支撑系统、路径规划作为独立核心模块建卡；
        不要为重名的页面（如重复的网格模型实现、填充算法）重复建卡。
      author: "HsBaSlicer docs"
    - text: >-
        为可选 RESTful API 服务单独建一张模块卡（restapi/ 目录）：边界=基于 cpp-httplib 的 HTTP 服务进程，
        经 DllHsBaSlicer C ABI 代理完整切片流水线；职责=端点路由、JSON/XML 协商、异步作业队列、配置编解码桥接、
        restapi.ini 加载；依赖方向=restapi → DllHsBaSlicer(pipelinetypes C ABI) + fileoperator(ParamStore) +
        utils(struct_json) + httplib；与 C ABI 直接调用方（samples/Lua）互不依赖。勿并入切片引擎或集成指南卡。
      author: "HsBaSlicer docs"

scope:
  include: []
  # 排除构建产物、依赖与生成物，聚焦源码，提升 Wiki 与知识卡的有效信息密度
  exclude:
    - "vcpkg_installed/**"
    - "third_parts_without_vcpkg/**"
    - "out/**"
    - "build/**"
    - ".cache/**"
    - "**/__pycache__/**"
    - "**/*.obj"
    - "**/*.pdb"
    - "android/.gradle/**"
    - "android/.idea/**"
    - "android/build/**"
    - "docs/doxygen/**"
