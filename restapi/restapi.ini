; ---------------------------------------------------------------------------
; restapi.ini - default configuration for HsBaSlicerRestServer
;
; The server looks for this file in its working directory (same convention as
; logcfg.ini). Override the path with the --config <file> command-line option.
; All keys are optional; the values shown here are the built-in defaults.
; ---------------------------------------------------------------------------

[server]
; Bind address. 127.0.0.1 keeps the service local-only, and a loopback bind is
; the only case where authorization is skipped. Use 0.0.0.0 to expose the server
; on the LAN: then [auth] token credentials become mandatory and TLS should be
; enabled with tls_cert/tls_key below.
host = 127.0.0.1
; TCP port the HTTP server listens on.
port = 8080
; Default response format when a request specifies neither ?format= nor an
; Accept header: json or xml.
default_format = json
; Max number of slicing jobs executed concurrently by the worker pool.
max_concurrent_jobs = 2
; Upper bound on tracked jobs (queued + running + retained results). New
; submissions are rejected with HTTP 429 once this limit is reached.
max_jobs = 128
; How long a finished job's result is retained in memory, in seconds.
result_ttl_seconds = 3600
; PEM certificate/key paths enabling HTTPS. Both must be set together; leaving them
; empty keeps plain HTTP. Requires the build to link cpp-httplib with OpenSSL (the
; rest-api manifest feature enables it), otherwise startup fails with a clear message.
tls_cert =
tls_key =
; When true the server refuses to start without a tls_cert/tls_key pair.
require_tls = false

; ---------------------------------------------------------------------------
; Model-file upload pool used by multipart POST /api/jobs/{kind} and inspected
; through /api/uploads. Leaving dir empty disables uploads (multipart submits
; answer 503) while every other endpoint keeps working.
;
; The pool is deliberately independent of [server] result_ttl_seconds: reaping a
; finished job never deletes its uploaded model, because a slicing job can take
; many hours while its source file is still needed for a re-run.
; ---------------------------------------------------------------------------
[upload]
; Upload root directory (relative paths resolve against the server's working
; directory). Created on demand; one subdirectory per job.
dir =
; Retained model files. The configured value is raised to at least
; HSBA_MODEL_POOL_SIZE (10 with CGAL/OCCT kernels, otherwise 1) so the in-process
; model pool can always be refilled from retained uploads.
max_files = 256
; Retention in seconds, counted from the moment the owning job reaches a terminal
; state (success or failure). Files that never got a job are counted from their
; creation time. 0 = never expire by age. Capped at 30 days.
ttl_seconds = 604800
; Reclaim policy: ttl | count | both | manual.
;   ttl    - drop entries whose retention elapsed
;   count  - drop the oldest entries once max_files is exceeded
;   both   - apply ttl and count together (default)
;   manual - only DELETE /api/uploads/{id} removes files
; Entries referenced by a queued/running job are never reclaimed.
evict_mode = both
; Per-file size cap, in MB.
max_file_mb = 256
; Whole request body cap, in MB (must cover the model file plus multipart
; boundaries); raised automatically to max_file_mb + 4 when configured lower.
max_request_mb = 260
; Directory-wide size cap in MB; 0 = unlimited.
max_total_mb = 0
; Period of the background retention sweep, in seconds.
sweep_interval_seconds = 60

; ---------------------------------------------------------------------------
; ParamStore backend used by the /api/params endpoints. The connection is
; resolved per request; leaving backend empty makes those endpoints return 503.
; ---------------------------------------------------------------------------
[paramstore]
; sqlite | mysql | postgresql
backend = sqlite
; SQLite database file path (used when backend = sqlite).
sqlite_path = hsba_params.db
; host / user / password / database / port are used by mysql and postgresql.
host =
user =
password =
database =
port = 0
; Optional at-rest encryption password (leave empty for plaintext storage).
crypto_password =

; ---------------------------------------------------------------------------
; Shared-token authorization. It is enforced only when the server is bound to a
; NON-loopback address: a 127.0.0.1 / ::1 bind stays token-free by design so
; local workflows and container health probes keep working.
; Clients send either "Authorization: Bearer <token>" or "X-API-Key: <token>".
; ---------------------------------------------------------------------------
[auth]
; auto | true | false. Empty (or auto) enables auth exactly when a token is set.
enabled =
; The shared secret. Enabling auth with an empty token is a startup error.
; Prefer injecting the token out of the image via the HSBA_REST_AUTH_TOKEN
; environment variable (read only when no token is configured here).
token =

; ---------------------------------------------------------------------------
; Reserved for a future release. Not read by the current implementation.
; ---------------------------------------------------------------------------
[rate_limit]
requests_per_minute = 0
